[project]
name = "awaken-system"
version = "0.1.0"
description = "Gamified habit tracker inspired by Solo Leveling and cultivation manhwas"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.scripts]
awaken-system = "awaken.app:main"

[project.optional-dependencies]
dev = ["pytest"]
ai = ["anthropic>=1.8", "keyring"]   # nomes de Skills por IA (opcional)

[tool.setuptools.packages.find]
include = ["awaken*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
